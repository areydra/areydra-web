services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:3001
      - API_BASE_URL=http://api:3001
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
