name: verify

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: typecheck · lint · format · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          # Build-time placeholders: the API is not reachable from CI, and every
          # data route is dynamic, so nothing is prerendered against it.
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_SITE_URL: https://areydra.com
